name: scaledatapipe

# Kafka (KRaft) + HDFS + Spark standalone.
#   docker compose up -d --build   (not --wait: kafka-init is a one-shot job)
# "streaming" then continuously moves Kafka data into Bronze and Silver on HDFS.
# Run producers / scripts / one-off Spark jobs through the "app" service, e.g.
#   docker compose run --rm app python3 -m scaledatapipe.producers.weather
#   docker compose run --rm app submit-local scaledatapipe/medallion/gold.py

x-spark-image: &spark-image
  image: scaledatapipe/spark:3.5.1
  build:
    context: .
    dockerfile: docker/spark/Dockerfile

services:
  # ---------------------------------------------------------------- Kafka
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    restart: unless-stopped
    mem_limit: 576m
    ports:
      - "9092:9092" # host access (producers run from the local venv)
    environment:
      CLUSTER_ID: fzS69bnyQdupyBFYlbOw1w # fixed so the volume survives restarts
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xmx256m -Xms256m # image default is 1 GB
    volumes:
      - kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    <<: *spark-image
    command: ["python3", "-m", "scripts.create_topics"]
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
    depends_on:
      kafka: { condition: service_healthy }
    restart: "no"

  # ---------------------------------------------------------------- HDFS
  # Official images are amd64-only: emulated on Apple Silicon.
  namenode:
    image: apache/hadoop:3.3.6
    platform: linux/amd64
    hostname: namenode
    command: ["hdfs", "namenode"]
    restart: unless-stopped
    mem_limit: 640m
    ports:
      - "9870:9870" # NameNode web UI
    env_file: docker/hadoop.env
    environment:
      ENSURE_NAMENODE_DIR: /data/namenode # formatted on first start only
      HADOOP_HEAPSIZE_MAX: 256m # JVM default would be 1/4 of the VM's RAM
    volumes:
      - namenode:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9870/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18

  datanode:
    image: apache/hadoop:3.3.6
    platform: linux/amd64
    hostname: datanode
    command: ["hdfs", "datanode"]
    restart: unless-stopped
    mem_limit: 768m # includes page cache of block writes (reclaimed first)
    env_file: docker/hadoop.env
    environment:
      HADOOP_HEAPSIZE_MAX: 192m # also caps the healthcheck's hdfs CLI JVM
    volumes:
      - datanode:/data
    depends_on:
      namenode: { condition: service_started } # datanode retries until the namenode is up
    # Healthy = HDFS writable. After a restart the namenode stays in safe mode
    # until this datanode reports its blocks; writes fail until then.
    # Each check starts an hdfs CLI JVM (costly under emulation): frequent while
    # starting up, then once a minute.
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -safemode get 2>/dev/null | grep -q OFF"]
      interval: 60s
      timeout: 60s # hdfs CLI JVM starts slowly under amd64 emulation
      start_period: 180s
      start_interval: 10s
      retries: 3

  # ---------------------------------------------------------------- Spark
  spark-master:
    <<: *spark-image
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    restart: unless-stopped
    mem_limit: 320m
    environment:
      SPARK_DAEMON_MEMORY: 192m # default 1 GB
    ports:
      - "8080:8080" # Spark master web UI
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; socket.create_connection(('spark-master', 7077), 2)\""]
      interval: 10s
      timeout: 5s
      retries: 12

  spark-worker:
    <<: *spark-image
    hostname: spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    restart: unless-stopped
    mem_limit: 1024m # worker daemon + the streaming executor
    environment:
      SPARK_DAEMON_MEMORY: 192m # the worker daemon itself; default 1 GB
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 512m # room for exactly one 512 MB executor (the streaming job)
    depends_on:
      spark-master: { condition: service_healthy }

  # ---------------------------------------------------------------- Pipeline
  # Long-running Medallion job: Kafka -> Bronze -> Silver (+ quarantine) on HDFS.
  streaming:
    <<: *spark-image
    command: ["submit", "scaledatapipe/medallion/run.py"]
    mem_limit: 896m # driver: 512 MB heap + JVM/Python overhead
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      DATA_ROOT: hdfs://namenode:8020/scaledatapipe
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      datanode: { condition: service_healthy }
      # Restarted along with the master: its app would not survive a new master.
      spark-master: { condition: service_healthy, restart: true }
      spark-worker: { condition: service_started }
    restart: unless-stopped

  # ---------------------------------------------------------------- Tools
  # One-off container for producers, scripts and spark-submit (not started by "up").
  app:
    <<: *spark-image
    profiles: ["tools"]
    mem_limit: 1152m # submit-local jobs: 640 MB heap + JVM/Python overhead
    env_file:
      - path: .env
        required: false
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      DATA_ROOT: hdfs://namenode:8020/scaledatapipe
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      datanode: { condition: service_healthy }
      spark-worker: { condition: service_started }

volumes:
  kafka:
  namenode:
  datanode:
